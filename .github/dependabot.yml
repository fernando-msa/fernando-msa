version: 2
updates:
  # Mantém as GitHub Actions atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Mantém as dependências do ecossistema que você usa (ex: npm para extensões ou web app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
